[package]
name = "enzyme-core"
version = "0.7.2"
edition = "2024"
description = "Core library for Enzyme — local-first knowledge indexing and approximate search"
license = "Apache-2.0"
repository = "https://github.com/byenzyme/enzyme"
publish = false

[dependencies]
enzyme-spec = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
libsql = { version = "0.9", default-features = false, features = ["core", "remote"] }
rusqlite = { workspace = true }
flate2 = "1"
ese = { path = "vendor/ese", features = ["dim-512", "rayon", "quant-8"], default-features = false }
instant-distance = "0.6"
pulldown-cmark = "0.12"
rayon = "1"
walkdir = "2"
ignore = "0.4"
tracing = "0.1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-stream = "0.3"
toml = "0.8"
toml_edit = "0.22"

[features]
default = []
# Login/logout, account credit billing, and account credential storage. The
# anonymous resolver stays in the default embedder build.
account = ["libsql/tls"]
# Benchmarks/examples and the vendored ESE test/benchmark harnesses are opt-in
# so embedders receive a lean default build without downstream pruning.
scaffolding = ["ese/scaffolding"]
rten = ["dep:rten", "dep:rten-tensor", "dep:tokenizers"]
# In-process llama.cpp inference. OFF by default: enabling it pulls in
# llama-cpp-sys-2, which needs cmake + a C/C++ toolchain + libclang.
local-llm = ["dep:llama-cpp-2", "dep:encoding_rs"]

# Exact pin: llama-cpp-2 does not follow semver (see the 2026-08-08 bundling
# recommendation); bump deliberately.
[dependencies.llama-cpp-2]
version = "=0.1.154"
optional = true
default-features = false
features = ["common"]

# Pin the sys crate too. `llama-cpp-2 = "=0.1.154"` alone does not constrain it,
# and its bindings are not semver-stable either: llama-cpp-sys-2 0.1.156
# (2026-09-02) changed function arities, so 0.1.154 no longer compiles against
# it. Because Cargo.lock is untracked, release CI resolves the newest 0.1.x and
# broke the v0.10.0 build. Bump the two together, deliberately.
[dependencies.llama-cpp-sys-2]
version = "=0.1.154"
optional = true

[dependencies.encoding_rs]
version = "0.8"
optional = true

[dependencies.rten]
version = "0.24"
optional = true

[dependencies.rten-tensor]
version = "0.24"
optional = true

[dependencies.tokenizers]
version = "0.21"
optional = true
default-features = false
features = ["onig"]

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "catalyze"
harness = false
required-features = ["scaffolding"]

[[example]]
name = "bench_cpu_features"
required-features = ["scaffolding"]

[[example]]
name = "bench_ese_batching"
required-features = ["scaffolding"]

[[example]]
name = "era_diagnostic"
required-features = ["scaffolding"]

[[example]]
name = "recompute_sim"
required-features = ["scaffolding"]
