[package]
name = "enzyme-core"
version.workspace = true
edition.workspace = true
description = "Core library for Enzyme — local-first knowledge indexing and approximate search"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
libsql = { workspace = true }
ese = { workspace = true }
instant-distance = { workspace = true }
pulldown-cmark = { workspace = true }
rayon = { workspace = true }
walkdir = { workspace = true }
ignore = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
futures = "0.3"
async-stream = "0.3"
toml = "0.8"

[features]
rten = ["dep:rten", "dep:rten-tensor", "dep:tokenizers"]
# In-process llama.cpp inference. OFF by default: enabling it pulls in
# llama-cpp-sys-2, which needs cmake + a C/C++ toolchain + libclang.
local-llm = ["dep:llama-cpp-2", "dep:encoding_rs"]

# Exact pin: llama-cpp-2 does not follow semver (see the 2026-08-08 bundling
# recommendation); bump deliberately.
[dependencies.llama-cpp-2]
version = "=0.1.154"
optional = true
default-features = false
features = ["common"]

[dependencies.encoding_rs]
version = "0.8"
optional = true

[dependencies.rten]
version = "0.24"
optional = true

[dependencies.rten-tensor]
version = "0.24"
optional = true

[dependencies.tokenizers]
version = "0.21"
optional = true
default-features = false
features = ["onig"]

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "catalyze"
harness = false
