[package]
name = "enzyme-cli"
version.workspace = true
edition.workspace = true
description = "CLI for Enzyme"

[[bin]]
name = "enzyme"
path = "src/main.rs"

[dependencies]
axum.workspace = true
enzyme-spec = { path = "../enzyme-spec" }
enzyme-core = { path = "../enzyme-core", features = ["account"] }
reqwest = { workspace = true, features = ["multipart", "stream"] }
flate2 = "1"
tar = "0.4"
futures = "0.3"
enzyme-api = { path = "../enzyme-api" }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
crossterm = { workspace = true }
atty = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
libsql = { workspace = true }
ignore = { workspace = true }
rmcp = { version = "1", features = ["server", "transport-io"] }
schemars = "1"
fs2 = "0.4"
tempfile = "3.26.0"

[dev-dependencies]
wiremock = "0.6"
serde_json = { workspace = true }
tempfile = "3.26.0"
tokio = { workspace = true }
rusqlite = { workspace = true }

[features]
rten = ["enzyme-core/rten"]
# Bundle llama.cpp and run catalyst generation in-process (see
# docs/2026-08-08-local-llm-bundling-recommendation.md). Release CI only.
local-llm = ["enzyme-core/local-llm"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"
