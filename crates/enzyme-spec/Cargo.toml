[package]
name = "enzyme-spec"
# Self-contained so the crate builds and packages outside this workspace.
# Keep `license` equal to the workspace license until a publication license is
# chosen; see README.md "Publishing".
version = "0.11.1"
edition = "2024"
rust-version = "1.85"
license = "BUSL-1.1"
description = "Parser, resolver, and renderer for the readable .enzyme workspace language"
repository = "https://github.com/useenzyme/enzyme-rust"
readme = "README.md"
keywords = ["enzyme", "parser", "configuration", "dsl"]
categories = ["parser-implementations", "config"]

[dependencies]
anyhow = "1.0.86"
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.120"

[dev-dependencies]
tempfile = "3.10"
