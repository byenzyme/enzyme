[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enzyme-python-package"
version = "0.4.7"
description = "Vault intelligence — concept graph and semantic search for markdown notes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Joshua Pham"}]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://memory.enzyme.garden"
Repository = "https://github.com/useenzyme/enzyme"

[project.scripts]
enzyme = "enzyme_python_package:main"
