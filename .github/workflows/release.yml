name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_REPO: jshph/enzyme

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin enzyme

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf enzyme-${{ matrix.target }}.tar.gz enzyme
          shasum -a 256 enzyme-${{ matrix.target }}.tar.gz > enzyme-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enzyme-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/enzyme-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/enzyme-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Download model files from latest release
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          mkdir -p model-files
          gh release download --repo "$RELEASE_REPO" --pattern 'model.onnx' --dir model-files || true
          gh release download --repo "$RELEASE_REPO" --pattern 'tokenizer.json' --dir model-files || true

      - name: Create release on public repo
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          files=$(find artifacts -name '*.tar.gz' -o -name '*.sha256')

          # Include model files if available
          model_files=""
          [ -f model-files/model.onnx ] && model_files="$model_files model-files/model.onnx"
          [ -f model-files/tokenizer.json ] && model_files="$model_files model-files/tokenizer.json"

          gh release create "$tag" \
            --repo "$RELEASE_REPO" \
            --title "enzyme $tag" \
            --generate-notes \
            $files \
            $model_files

  sync-plugin:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sync plugin files to public repo
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPO}.git" public-repo
          cd public-repo

          rsync -av --delete \
            --exclude '.git' \
            --exclude '.claude-plugin' \
            ../plugin/ ./

          version="${tag#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${version}\"/" .claude-plugin/plugin.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${version}\"/" .claude-plugin/marketplace.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No plugin changes to sync"
          else
            git commit -m "Sync plugin files from enzyme-rust ${tag}"
            git push origin main
          fi

  update-homebrew:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS artifact for SHA256
        uses: actions/download-artifact@v4
        with:
          name: enzyme-aarch64-apple-darwin
          path: artifacts

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # Read SHA256 from the build artifact
          sha256=$(cat artifacts/enzyme-aarch64-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          echo "SHA256: ${sha256}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/jshph/homebrew-enzyme.git" tap
          cd tap

          cat > Formula/enzyme-cli.rb << FORMULA
          class EnzymeCli < Formula
            desc "Local-first knowledge indexing for Obsidian vaults"
            homepage "https://github.com/jshph/enzyme"
            version "${version}"
            license "MIT"

            url "https://github.com/jshph/enzyme/releases/download/v#{version}/enzyme-aarch64-apple-darwin.tar.gz"
            sha256 "${sha256}"

            depends_on :macos
            depends_on arch: :arm64

            def install
              bin.install "enzyme"
            end

            def caveats
              <<~EOS
                Enzyme installed successfully!

                Download the embedding model (~52 MB):
                  enzyme setup

                Then initialize your vault:
                  cd /path/to/your/vault
                  enzyme init

                Setup guide: https://enzyme.garden/setup
              EOS
            end

            test do
              system "#{bin}/enzyme", "--help"
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' Formula/enzyme-cli.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/enzyme-cli.rb
          if git diff --cached --quiet; then
            echo "No Homebrew changes"
          else
            git commit -m "Update enzyme to ${version}"
            # Push to whatever the default branch is
            default_branch=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')
            git push origin "HEAD:${default_branch}"
          fi
