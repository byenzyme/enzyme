name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Public repo where binaries are published
  RELEASE_REPO: jshph/enzyme

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin enzyme

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf enzyme-${{ matrix.target }}.tar.gz enzyme
          shasum -a 256 enzyme-${{ matrix.target }}.tar.gz > enzyme-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enzyme-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/enzyme-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/enzyme-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release on public repo
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"

          # Collect all tarballs and checksums
          files=$(find artifacts -name '*.tar.gz' -o -name '*.sha256')

          # Create release on the public repo
          gh release create "$tag" \
            --repo "$RELEASE_REPO" \
            --title "enzyme $tag" \
            --generate-notes \
            $files
