name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Public repo where binaries are published
  RELEASE_REPO: jshph/enzyme

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin enzyme

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf enzyme-${{ matrix.target }}.tar.gz enzyme
          shasum -a 256 enzyme-${{ matrix.target }}.tar.gz > enzyme-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: enzyme-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/enzyme-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/enzyme-${{ matrix.target }}.tar.gz.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release on public repo
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"

          # Collect all tarballs and checksums
          files=$(find artifacts -name '*.tar.gz' -o -name '*.sha256')

          # Create release on the public repo
          gh release create "$tag" \
            --repo "$RELEASE_REPO" \
            --title "enzyme $tag" \
            --generate-notes \
            $files

  sync-plugin:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sync plugin files to public repo
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPO}.git" public-repo
          cd public-repo

          # Sync plugin files from enzyme-rust/plugin/ → public repo root
          rsync -av --delete \
            --exclude '.git' \
            --exclude '.claude-plugin' \
            --exclude 'README.md' \
            ../plugin/ ./

          # Update version in plugin.json and marketplace.json
          version="${tag#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${version}\"/" .claude-plugin/plugin.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${version}\"/" .claude-plugin/marketplace.json

          # Commit and push if there are changes
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No plugin changes to sync"
          else
            git commit -m "Sync plugin files from enzyme-rust ${tag}"
            git push origin main
          fi
