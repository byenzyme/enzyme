name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_REPO: ${{ github.repository }}
  HOMEBREW_TAP_REPO: byenzyme/homebrew-enzyme

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            release_name: macos-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            release_name: macos-x86_64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            release_name: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            release_name: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - name: Add target to active toolchain
        run: rustup target add ${{ matrix.target }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Build UI
        run: cd ui && npm ci && npm run build

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin enzyme --features local-llm

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf enzyme-${{ matrix.release_name }}.tar.gz enzyme
          shasum -a 256 enzyme-${{ matrix.release_name }}.tar.gz > enzyme-${{ matrix.release_name }}.tar.gz.sha256

      - name: Create MCPB bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MCPB_DIR="mcpb-staging"
          MCPB_FILE="enzyme-mcp-${VERSION}-${{ matrix.release_name }}.mcpb"

          mkdir -p "$MCPB_DIR"
          cp target/${{ matrix.target }}/release/enzyme "$MCPB_DIR/"
          chmod +x "$MCPB_DIR/enzyme"

          # Determine platform for manifest
          case "${{ matrix.release_name }}" in
            macos-arm64)   PLATFORMS='["darwin"]' ;;
            macos-x86_64)  PLATFORMS='["darwin"]' ;;
            linux-x86_64)  PLATFORMS='["linux"]' ;;
            linux-arm64)   PLATFORMS='["linux"]' ;;
          esac

          cat > "$MCPB_DIR/manifest.json" << EOF
          {
            "manifest_version": "0.3",
            "name": "enzyme",
            "display_name": "Enzyme",
            "version": "${VERSION}",
            "description": "Semantic search and pattern discovery for Obsidian and markdown vaults.",
            "keywords": ["obsidian", "markdown", "vault", "semantic search", "knowledge base", "PKM", "notes"],
            "author": {
              "name": "Joshua Pham",
              "url": "https://github.com/byenzyme"
            },
            "homepage": "https://memory.enzyme.garden",
            "documentation": "https://memory.enzyme.garden/setup",
            "repository": {
              "type": "github",
              "url": "https://github.com/byenzyme/enzyme"
            },
            "license": "MIT",
            "server": {
              "type": "binary",
              "entry_point": "enzyme",
              "mcp_config": {
                "command": "\${__dirname}/enzyme",
                "args": ["mcp"],
                "env": {
                  "ENZYME_VAULT_PATH": "\${user_config.vault_path}"
                }
              }
            },
            "user_config": {
              "vault_path": {
                "type": "directory",
                "title": "Vault Path",
                "description": "Path to your Obsidian/Markdown vault directory (leave empty to use current directory)",
                "required": false
              }
            },
            "tools_generated": true,
            "compatibility": {
              "platforms": ${PLATFORMS}
            }
          }
          EOF
          # Remove leading whitespace from heredoc
          sed -i.bak 's/^          //' "$MCPB_DIR/manifest.json" && rm -f "$MCPB_DIR/manifest.json.bak"

          cd "$MCPB_DIR"
          zip -r "../$MCPB_FILE" .
          cd ..
          shasum -a 256 "$MCPB_FILE" > "$MCPB_FILE.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enzyme-${{ matrix.release_name }}
          path: |
            target/${{ matrix.target }}/release/enzyme-${{ matrix.release_name }}.tar.gz
            target/${{ matrix.target }}/release/enzyme-${{ matrix.release_name }}.tar.gz.sha256

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: enzyme-mcpb-${{ matrix.release_name }}
          path: |
            enzyme-mcp-*-${{ matrix.release_name }}.mcpb
            enzyme-mcp-*-${{ matrix.release_name }}.mcpb.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Generate server.json for MCP Registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGES=""

          add_package() {
            local MCPB_FILE="$1"
            if [ ! -f "$MCPB_FILE" ]; then return; fi
            local SHA256=$(sha256sum "$MCPB_FILE" | cut -d' ' -f1)
            if [ -n "$PACKAGES" ]; then PACKAGES="${PACKAGES},"; fi
            PACKAGES="${PACKAGES}{
                \"registryType\": \"mcpb\",
                \"identifier\": \"https://github.com/byenzyme/enzyme/releases/download/v${VERSION}/$(basename "$MCPB_FILE")\",
                \"fileSha256\": \"${SHA256}\",
                \"transport\": { \"type\": \"stdio\" },
                \"environmentVariables\": [
                  {
                    \"name\": \"ENZYME_VAULT_PATH\",
                    \"description\": \"Path to your Obsidian/Markdown vault directory\",
                    \"isRequired\": false,
                    \"format\": \"string\",
                    \"isSecret\": false
                  }
                ]
              }"
          }

          add_package "$(find artifacts -name "enzyme-mcp-*-macos-arm64.mcpb" | head -1)"
          add_package "$(find artifacts -name "enzyme-mcp-*-macos-x86_64.mcpb" | head -1)"
          add_package "$(find artifacts -name "enzyme-mcp-*-linux-x86_64.mcpb" | head -1)"
          add_package "$(find artifacts -name "enzyme-mcp-*-linux-arm64.mcpb" | head -1)"

          if [ -n "$PACKAGES" ]; then
            cat > artifacts/server.json << EOF
          {
            "\$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            "name": "io.github.byenzyme/enzyme",
            "title": "Enzyme",
            "description": "Semantic search and pattern discovery for Obsidian and markdown vaults.",
            "version": "${VERSION}",
            "websiteUrl": "https://memory.enzyme.garden",
            "repository": {
              "url": "https://github.com/byenzyme/enzyme",
              "source": "github"
            },
            "packages": [
              ${PACKAGES}
            ]
          }
          EOF
            sed -i 's/^          //' artifacts/server.json
            echo "Generated server.json:"
            cat artifacts/server.json
          else
            echo "Warning: No MCPB files found, skipping server.json generation"
          fi

      - name: Create release on public repo
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          files=$(find artifacts -name '*.tar.gz' -o -name '*.sha256' -o -name '*.mcpb' -o -name 'server.json')

          # Delete existing release if re-publishing the same tag
          gh release delete "$tag" --repo "$RELEASE_REPO" --yes 2>/dev/null || true

          notes_file=".github/release-notes/${tag}.md"
          notes_args=(--generate-notes)
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          fi

          gh release create "$tag" \
            --repo "$RELEASE_REPO" \
            --title "enzyme $tag" \
            "${notes_args[@]}" \
            $files

      - name: Load release metadata for Discord
        id: release_metadata
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh api "repos/${RELEASE_REPO}/releases/tags/${tag}" > release.json

          python3 <<'PY'
          import json
          import os

          with open("release.json", encoding="utf-8") as handle:
              release = json.load(handle)

          values = {
              "name": release.get("name") or release.get("tag_name") or "Release",
              "body": (release.get("body") or "Release notes were not provided for this release.").strip(),
              "html_url": release.get("html_url", ""),
          }

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  marker = f"__{key.upper()}__"
                  print(f"{key}<<{marker}", file=output)
                  print(value, file=output)
                  print(marker, file=output)
          PY

      - name: Publish release notes to Discord
        if: ${{ env.DISCORD_RELEASE_WEBHOOK_URL != '' }}
        continue-on-error: true
        uses: SethCohen/github-releases-to-discord@24d166886aee4646d448c8a389ff9e1ebcab3682 # v1.20.0
        with:
          webhook_url: ${{ env.DISCORD_RELEASE_WEBHOOK_URL }}
          release_name: ${{ steps.release_metadata.outputs.name }}
          release_body: ${{ steps.release_metadata.outputs.body }}
          release_html_url: ${{ steps.release_metadata.outputs.html_url }}
          color: "8141549"
          username: "Enzyme releases"
          footer_title: "byenzyme/enzyme"
          reduce_headings: true
          max_description: "3800"

  publish-mcp-registry:
    needs: publish
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-mcp-registry.yml
    with:
      tag: ${{ github.ref_name }}

  sync-skill:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Update enzyme-skill repo
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          git lfs install
          git clone "https://x-access-token:${GH_TOKEN}@github.com/byenzyme/enzyme-skill.git" skill-repo
          cd skill-repo

          mkdir -p bin tmp-bin

          # Remove legacy enzyme/ subdirectory if present (flatten to repo root)
          rm -rf enzyme

          # Remove legacy model files
          rm -rf models
          rm -rf references
          rm -f setup.py
          rm -f setup-guide.md

          # Extract platform binaries
          for platform in macos-arm64 macos-x86_64 linux-arm64 linux-x86_64; do
            tar xzf "../artifacts/enzyme-${platform}/enzyme-${platform}.tar.gz" -C tmp-bin
            mv tmp-bin/enzyme "bin/enzyme-${platform}"
            chmod +x "bin/enzyme-${platform}"
          done
          rm -rf tmp-bin

          # Sync agent plugin files (SKILL.md, Hermes adapter, install script)
          cp ../agent/SKILL.md ./SKILL.md
          cp ../agent/plugin.yaml ./plugin.yaml
          cp ../agent/__init__.py ./__init__.py
          cp ../agent/schemas.py ./schemas.py
          cp ../agent/tools.py ./tools.py
          cp ../agent/hooks.py ./hooks.py
          cp ../agent/install.sh ./install.sh
          cp ../agent/README.md ./README.md
          cp ../agent/CLAUDE.md ./CLAUDE.md

          # Update .gitattributes for flattened layout
          printf 'bin/enzyme-* filter=lfs diff=lfs merge=lfs -text\n' > .gitattributes

          # Update versions
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${version}\"/" ./SKILL.md
          sed -i "s/version: \"[^\"]*\"/version: \"${version}\"/" ./plugin.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No skill changes to sync"
          else
            git commit -m "Update to ${version}"
            git push origin master
          fi

  update-homebrew:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS arm64 artifact for SHA256
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enzyme-macos-arm64
          path: artifacts/macos-arm64

      - name: Download macOS x86_64 artifact for SHA256
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: enzyme-macos-x86_64
          path: artifacts/macos-x86_64

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # Read SHA256 values from the build artifacts
          sha256_arm64=$(awk '{print $1}' artifacts/macos-arm64/enzyme-macos-arm64.tar.gz.sha256)
          sha256_x86_64=$(awk '{print $1}' artifacts/macos-x86_64/enzyme-macos-x86_64.tar.gz.sha256)
          echo "SHA256 arm64: ${sha256_arm64}"
          echo "SHA256 x86_64: ${sha256_x86_64}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap
          cd tap

          cat > Formula/enzyme-cli.rb << FORMULA
          class EnzymeCli < Formula
            desc "Local-first knowledge indexing for Obsidian vaults"
            homepage "https://github.com/byenzyme/enzyme"
            version "${version}"
            license "MIT"

            depends_on :macos

            if Hardware::CPU.arm?
              url "https://github.com/byenzyme/enzyme/releases/download/v#{version}/enzyme-macos-arm64.tar.gz"
              sha256 "${sha256_arm64}"
            else
              url "https://github.com/byenzyme/enzyme/releases/download/v#{version}/enzyme-macos-x86_64.tar.gz"
              sha256 "${sha256_x86_64}"
            end

            def install
              bin.install "enzyme"
            end

            def caveats
              <<~EOS
                Enzyme installed successfully!

                Install agent instructions from your notes folder:
                  cd /path/to/your/notes
                  enzyme install claude     # Claude Code
                  enzyme install codex      # Codex / Pi / generic .agents
                  enzyme install hermes     # Hermes (experimental)
                  enzyme install openclaw   # OpenClaw (experimental)

                Then paste the setup prompt from https://byenzyme.com/setup into your agent.
                It follows the installed enzyme-workspace-setup skill.
              EOS
            end

            test do
              system "#{bin}/enzyme", "--help"
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' Formula/enzyme-cli.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/enzyme-cli.rb
          if git diff --cached --quiet; then
            echo "No Homebrew changes"
          else
            git commit -m "Update enzyme to ${version}"
            # Push to whatever the default branch is
            default_branch=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')
            git push origin "HEAD:${default_branch}"
          fi
