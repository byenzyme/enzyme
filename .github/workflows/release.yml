name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_REPO: jshph/enzyme
  HOMEBREW_TAP_REPO: jshph/homebrew-enzyme

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            release_name: macos-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            release_name: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            release_name: linux-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure private git deps
        run: git config --global url."https://x-access-token:${{ secrets.FLOWER_COMPUTERS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build UI
        run: cd ui && npm ci && npm run build

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin enzyme

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf enzyme-${{ matrix.release_name }}.tar.gz enzyme
          shasum -a 256 enzyme-${{ matrix.release_name }}.tar.gz > enzyme-${{ matrix.release_name }}.tar.gz.sha256

      - name: Create MCPB bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MCPB_DIR="mcpb-staging"
          MCPB_FILE="enzyme-mcp-${VERSION}-${{ matrix.release_name }}.mcpb"

          mkdir -p "$MCPB_DIR"
          cp target/${{ matrix.target }}/release/enzyme "$MCPB_DIR/"
          chmod +x "$MCPB_DIR/enzyme"

          # Determine platform for manifest
          case "${{ matrix.release_name }}" in
            macos-arm64)   PLATFORMS='["darwin"]' ;;
            linux-x86_64)  PLATFORMS='["linux"]' ;;
            linux-arm64)   PLATFORMS='["linux"]' ;;
          esac

          cat > "$MCPB_DIR/manifest.json" << EOF
          {
            "manifest_version": "0.3",
            "name": "enzyme",
            "display_name": "Enzyme",
            "version": "${VERSION}",
            "description": "Semantic search and pattern discovery for Obsidian and markdown vaults.",
            "keywords": ["obsidian", "markdown", "vault", "semantic search", "knowledge base", "PKM", "notes"],
            "author": {
              "name": "Joshua Pham",
              "url": "https://github.com/jshph"
            },
            "homepage": "https://enzyme.garden",
            "documentation": "https://enzyme.garden/setup",
            "repository": {
              "type": "github",
              "url": "https://github.com/jshph/enzyme"
            },
            "license": "MIT",
            "server": {
              "type": "binary",
              "entry_point": "enzyme",
              "mcp_config": {
                "command": "\${__dirname}/enzyme",
                "args": ["mcp"],
                "env": {
                  "ENZYME_VAULT_PATH": "\${user_config.vault_path}"
                }
              }
            },
            "user_config": {
              "vault_path": {
                "type": "directory",
                "title": "Vault Path",
                "description": "Path to your Obsidian/Markdown vault directory (leave empty to use current directory)",
                "required": false
              }
            },
            "tools_generated": true,
            "compatibility": {
              "platforms": ${PLATFORMS}
            }
          }
          EOF
          # Remove leading whitespace from heredoc
          sed -i.bak 's/^          //' "$MCPB_DIR/manifest.json" && rm -f "$MCPB_DIR/manifest.json.bak"

          cd "$MCPB_DIR"
          zip -r "../$MCPB_FILE" .
          cd ..
          shasum -a 256 "$MCPB_FILE" > "$MCPB_FILE.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: enzyme-${{ matrix.release_name }}
          path: |
            target/${{ matrix.target }}/release/enzyme-${{ matrix.release_name }}.tar.gz
            target/${{ matrix.target }}/release/enzyme-${{ matrix.release_name }}.tar.gz.sha256

      - name: Upload MCPB artifact
        uses: actions/upload-artifact@v4
        with:
          name: enzyme-mcpb-${{ matrix.release_name }}
          path: |
            enzyme-mcp-*-${{ matrix.release_name }}.mcpb
            enzyme-mcp-*-${{ matrix.release_name }}.mcpb.sha256

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate server.json for MCP Registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGES=""

          add_package() {
            local MCPB_FILE="$1"
            if [ ! -f "$MCPB_FILE" ]; then return; fi
            local SHA256=$(sha256sum "$MCPB_FILE" | cut -d' ' -f1)
            if [ -n "$PACKAGES" ]; then PACKAGES="${PACKAGES},"; fi
            PACKAGES="${PACKAGES}{
                \"registryType\": \"mcpb\",
                \"identifier\": \"https://github.com/jshph/enzyme/releases/download/v${VERSION}/$(basename "$MCPB_FILE")\",
                \"fileSha256\": \"${SHA256}\",
                \"transport\": { \"type\": \"stdio\" },
                \"environmentVariables\": [
                  {
                    \"name\": \"ENZYME_VAULT_PATH\",
                    \"description\": \"Path to your Obsidian/Markdown vault directory\",
                    \"isRequired\": false,
                    \"format\": \"string\",
                    \"isSecret\": false
                  }
                ]
              }"
          }

          add_package "$(find artifacts -name "enzyme-mcp-*-macos-arm64.mcpb" | head -1)"
          add_package "$(find artifacts -name "enzyme-mcp-*-linux-x86_64.mcpb" | head -1)"
          add_package "$(find artifacts -name "enzyme-mcp-*-linux-arm64.mcpb" | head -1)"

          if [ -n "$PACKAGES" ]; then
            cat > artifacts/server.json << EOF
          {
            "\$schema": "https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json",
            "name": "io.github.jshph/enzyme",
            "title": "Enzyme",
            "description": "Semantic search and pattern discovery for Obsidian and markdown vaults.",
            "version": "${VERSION}",
            "websiteUrl": "https://enzyme.garden",
            "repository": {
              "url": "https://github.com/jshph/enzyme",
              "source": "github"
            },
            "packages": [
              ${PACKAGES}
            ]
          }
          EOF
            sed -i 's/^          //' artifacts/server.json
            echo "Generated server.json:"
            cat artifacts/server.json
          else
            echo "Warning: No MCPB files found, skipping server.json generation"
          fi

      - name: Create release on public repo
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          files=$(find artifacts -name '*.tar.gz' -o -name '*.sha256' -o -name '*.mcpb' -o -name 'server.json')

          # Delete existing release if re-publishing the same tag
          gh release delete "$tag" --repo "$RELEASE_REPO" --yes 2>/dev/null || true

          notes_file=".github/release-notes/${tag}.md"
          notes_args=(--generate-notes)
          if [ -f "$notes_file" ]; then
            notes_args=(--notes-file "$notes_file")
          fi

          gh release create "$tag" \
            --repo "$RELEASE_REPO" \
            --title "enzyme $tag" \
            "${notes_args[@]}" \
            $files

      - name: Publish release notes to Discord
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_RELEASE_WEBHOOK_URL is not configured; skipping Discord publish."
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          gh api "repos/${RELEASE_REPO}/releases/tags/${tag}" > release.json

          python3 <<'PY'
          import json
          import os
          import urllib.request

          with open("release.json", encoding="utf-8") as handle:
              release = json.load(handle)

          webhook_url = os.environ["DISCORD_WEBHOOK_URL"]
          release_name = release.get("name") or release.get("tag_name") or "Release"
          release_tag = release.get("tag_name", "")
          release_url = release.get("html_url", "")
          body = (release.get("body") or "").strip()

          if not body:
              body = "Release notes were not provided for this release."

          max_description = 3800
          if len(body) > max_description:
              body = body[: max_description - 25].rstrip() + "\n\n...continued on GitHub."

          title = f"jshph/enzyme {release_tag}".strip()
          payload = {
              "username": "Enzyme releases",
              "embeds": [
                  {
                      "title": title,
                      "url": release_url,
                      "description": body,
                      "color": 0x7C3AED,
                      "footer": {"text": release_name},
                  }
              ],
          }

          data = json.dumps(payload).encode("utf-8")
          request = urllib.request.Request(
              webhook_url,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              print(f"Discord webhook returned HTTP {response.status}")
          PY

  sync-plugin:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Bundle binaries into plugin
        run: |
          mkdir -p plugin/plugins/enzyme/bin tmp-bin

          # Extract Linux platform binaries into a temp dir to avoid overwriting
          # the committed wrapper script (plugin/plugins/enzyme/bin/enzyme).
          # The Claude desktop plugin runs inside a Linux VM, so only Linux
          # binaries ship here. Host CLI users install via Homebrew / install.sh.
          tar xzf artifacts/enzyme-linux-arm64/enzyme-linux-arm64.tar.gz -C tmp-bin
          mv tmp-bin/enzyme plugin/plugins/enzyme/bin/enzyme-linux-arm64

          tar xzf artifacts/enzyme-linux-x86_64/enzyme-linux-x86_64.tar.gz -C tmp-bin
          mv tmp-bin/enzyme plugin/plugins/enzyme/bin/enzyme-linux-x86_64

          # Ensure executability
          chmod +x plugin/plugins/enzyme/bin/enzyme plugin/plugins/enzyme/bin/enzyme-linux-arm64 plugin/plugins/enzyme/bin/enzyme-linux-x86_64

      - name: Download server.json from release
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release download "$tag" --repo "$RELEASE_REPO" \
            --pattern 'server.json' \
            --dir . \
            || echo "Warning: server.json not found in release"

      - name: Sync plugin files to public repo
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${RELEASE_REPO}.git" public-repo
          cd public-repo

          rsync -av --delete \
            --exclude '.git' \
            --exclude 'server.json' \
            --exclude 'agent' \
            ../plugin/ ./

          # Copy server.json to repo root for MCP Registry discovery
          [ -f ../server.json ] && cp ../server.json ./server.json

          version="${tag#v}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${version}\"/" plugins/enzyme/.claude-plugin/plugin.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${version}\"/" plugins/enzyme/.codex-plugin/plugin.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No plugin changes to sync"
          else
            git commit -m "Sync plugin files from enzyme-rust ${tag}"
            git push origin main
          fi

          # The public release is created before this sync so assets are available.
          # Move the public tag to the synced plugin commit so plugin installs pinned
          # with `codex plugin marketplace add jshph/enzyme --ref "$tag"` see the
          # same files as public main.
          git tag -f "$tag" HEAD
          git push --force origin "refs/tags/${tag}"

  sync-skill:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update enzyme-skill repo
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          git lfs install
          git clone "https://x-access-token:${GH_TOKEN}@github.com/jshph/enzyme-skill.git" skill-repo
          cd skill-repo

          mkdir -p bin tmp-bin

          # Remove legacy enzyme/ subdirectory if present (flatten to repo root)
          rm -rf enzyme

          # Remove legacy model files
          rm -rf models
          rm -rf references
          rm -f setup.py
          rm -f setup-guide.md

          # Extract platform binaries
          for platform in macos-arm64 linux-arm64 linux-x86_64; do
            tar xzf "../artifacts/enzyme-${platform}/enzyme-${platform}.tar.gz" -C tmp-bin
            mv tmp-bin/enzyme "bin/enzyme-${platform}"
            chmod +x "bin/enzyme-${platform}"
          done
          rm -rf tmp-bin

          # Sync agent plugin files (SKILL.md, Hermes adapter, install script)
          cp ../plugin/agent/SKILL.md ./SKILL.md
          cp ../plugin/agent/plugin.yaml ./plugin.yaml
          cp ../plugin/agent/__init__.py ./__init__.py
          cp ../plugin/agent/schemas.py ./schemas.py
          cp ../plugin/agent/tools.py ./tools.py
          cp ../plugin/agent/hooks.py ./hooks.py
          cp ../plugin/agent/install.sh ./install.sh
          cp ../plugin/agent/README.md ./README.md
          cp ../plugin/agent/CLAUDE.md ./CLAUDE.md

          # Update .gitattributes for flattened layout
          printf 'bin/enzyme-* filter=lfs diff=lfs merge=lfs -text\n' > .gitattributes

          # Update versions
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${version}\"/" ./SKILL.md
          sed -i "s/version: \"[^\"]*\"/version: \"${version}\"/" ./plugin.yaml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No skill changes to sync"
          else
            git commit -m "Update to ${version}"
            git push origin master
          fi

  update-homebrew:
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS artifact for SHA256
        uses: actions/download-artifact@v4
        with:
          name: enzyme-macos-arm64
          path: artifacts

      - name: Update Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.ENZYME_PUBLIC_RELEASE_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          # Read SHA256 from the build artifact
          sha256=$(awk '{print $1}' artifacts/enzyme-macos-arm64.tar.gz.sha256)
          echo "SHA256: ${sha256}"

          git clone "https://x-access-token:${GH_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" tap
          cd tap

          cat > Formula/enzyme-cli.rb << FORMULA
          class EnzymeCli < Formula
            desc "Local-first knowledge indexing for Obsidian vaults"
            homepage "https://github.com/jshph/enzyme"
            version "${version}"
            license "MIT"

            url "https://github.com/jshph/enzyme/releases/download/v#{version}/enzyme-macos-arm64.tar.gz"
            sha256 "${sha256}"

            depends_on :macos
            depends_on arch: :arm64

            def install
              bin.install "enzyme"
            end

            def caveats
              <<~EOS
                Enzyme installed successfully!

                Initialize your vault:
                  cd /path/to/your/vault
                  enzyme init

                Setup guide: https://enzyme.garden/setup
              EOS
            end

            test do
              system "#{bin}/enzyme", "--help"
            end
          end
          FORMULA

          # Remove leading whitespace from heredoc indentation
          sed -i 's/^          //' Formula/enzyme-cli.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/enzyme-cli.rb
          if git diff --cached --quiet; then
            echo "No Homebrew changes"
          else
            git commit -m "Update enzyme to ${version}"
            # Push to whatever the default branch is
            default_branch=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')
            git push origin "HEAD:${default_branch}"
          fi
