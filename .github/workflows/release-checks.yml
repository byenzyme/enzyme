name: Release checks

# Deterministic release integration checks.
# Linux-only by design: macOS and the agentic journeys run locally via
# `make release-check` / `make release-check-agentic` to avoid the 10x
# macOS-minute multiplier and agent token spend.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "agent/**"
      - "skills/**"
      - "openclaw/**"
      - "install.sh"
      - "agent-instructions.md"
      - "agent-runtime-skill.md"
      - "scripts/**"
      - "tests/fixtures/**"
      - "Makefile"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release-checks.yml"
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build enzyme-cli
        run: cargo build -p enzyme-cli --features local-llm

      - name: Install matrix
        run: bash scripts/release-checks/10-install-matrix.sh

      - name: Sync contract
        run: bash scripts/release-checks/20-sync-contract.sh

      # The full tier exercises the loginless hosted bootstrap against
      # memory.enzyme.garden — the real cold-start path — from a clean environment.
      - name: Vault lifecycle
        run: bash scripts/release-checks/30-vault-lifecycle.sh
