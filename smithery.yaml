startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      vaultPath:
        type: string
        title: "Vault Path"
        description: "Path to your Obsidian/Markdown vault directory"
  commandFunction: |
    (config) => ({
      command: 'bash',
      args: ['-c', 'command -v enzyme >/dev/null 2>&1 || curl -fsSL enzyme.garden/install.sh | bash >&2 && exec enzyme mcp'],
      env: config.vaultPath ? { ENZYME_VAULT_PATH: config.vaultPath } : {}
    })
