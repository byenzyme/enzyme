[workspace]
members = ["crates/*"]
exclude = ["scaffolding/ese-api-py"]
resolver = "2"

[workspace.package]
version = "0.11.1"
edition = "2024"
license = "BUSL-1.1"
repository = "https://github.com/useenzyme/enzyme-rust"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Database
libsql = { version = "0.9", default-features = false, features = ["core", "remote", "tls"] }
rusqlite = { package = "libsql-rusqlite", version = "=0.9.30", default-features = false, features = ["libsql-experimental", "modern_sqlite", "functions"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Web server
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
rust-embed = "8"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }

# Embedding inference
ese = { path = "crates/enzyme-core/vendor/ese", features = ["dim-512", "rayon", "quant-8"], default-features = false }

# HNSW
instant-distance = "0.6"

# Readable workspace language (public: github.com/byenzyme/enzyme-spec)
enzyme-spec = { git = "https://github.com/byenzyme/enzyme-spec", rev = "e0b41c9924ad52473fbb7321175349c082518688" }

# Document processing
pulldown-cmark = "0.12"

# Parallelism & file traversal
rayon = "1"
walkdir = "2"
ignore = "0.4"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Crypto
sha2 = "0.10"

# Terminal
crossterm = "0.28"
atty = "0.2"

# Utilities
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
